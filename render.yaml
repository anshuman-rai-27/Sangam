services:
  - type: web
    name: sangam
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m server.main
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PORT
        value: 8000
      - key: HF_REPO
        value: anshumanrai/sangam-gpt2-slices
