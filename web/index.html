<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sangam — Distributed Inference</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="hero">
    <div>
      <div class="hero-title">SAN<span>GAM</span></div>
      <p class="hero-sub">Split a language model across devices. Run inference together.</p>
    </div>

    <div class="action-card">
      <!-- Model selector -->
      <div class="model-select-wrap">
        <label class="model-label" for="model-select">Model</label>
        <select id="model-select" class="model-select">
          <option value="" disabled selected>Loading models…</option>
        </select>
        <div id="model-desc" class="model-desc"></div>
      </div>

      <button class="btn-primary" id="btn-create" onclick="createRoom()">
        Create new room
      </button>

      <div class="divider">or</div>

      <div class="input-row">
        <input type="text" id="room-input" placeholder="Room code (e.g. a3f9c2b1)"
               onkeydown="if(event.key==='Enter') joinRoom()">
        <button class="btn-secondary" onclick="joinRoom()">Join</button>
      </div>
      <div id="err" style="color:var(--red);font-size:12px;min-height:16px;"></div>
    </div>
  </div>

  <script>
    let _models = [];

    async function loadModels() {
      try {
        const resp = await fetch('/models');
        _models = await resp.json();
        const sel = document.getElementById('model-select');
        sel.innerHTML = '';
        _models.forEach((m, i) => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          if (i === 0) opt.selected = true;
          sel.appendChild(opt);
        });
        updateDesc();
      } catch (e) {
        document.getElementById('model-select').innerHTML = '<option value="">Failed to load models</option>';
      }
    }

    function updateDesc() {
      const sel = document.getElementById('model-select');
      const m = _models.find(x => x.id === sel.value);
      document.getElementById('model-desc').textContent = m ? m.description : '';
    }

    document.getElementById('model-select').addEventListener('change', updateDesc);
    loadModels();

    async function createRoom() {
      const btn = document.getElementById('btn-create');
      const model = document.getElementById('model-select').value;
      if (!model) { document.getElementById('err').textContent = 'Select a model first.'; return; }
      btn.disabled = true;
      btn.textContent = 'Creating…';
      try {
        const resp = await fetch('/room/create', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ model }),
        });
        const { room_id } = await resp.json();
        window.location.href = `/room/${room_id}`;
      } catch (e) {
        document.getElementById('err').textContent = 'Server error — is it running?';
        btn.disabled = false;
        btn.textContent = 'Create new room';
      }
    }

    function joinRoom() {
      const id = document.getElementById('room-input').value.trim();
      if (!id) { document.getElementById('err').textContent = 'Enter a room code.'; return; }
      window.location.href = `/room/${id}`;
    }
  </script>
</body>
</html>
